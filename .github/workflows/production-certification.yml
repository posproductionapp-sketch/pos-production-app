name: Production Certification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  certify:
    name: Final production certification
    runs-on: ubuntu-latest
    env:
      CERTIFICATION_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      DATABASE_URL: postgresql+psycopg://pos:pos@localhost:5432/pos_test
      LIBPQ_DATABASE_URL: postgresql://pos:pos@localhost:5432/pos_test
      REDIS_URL: redis://localhost:6379/0
      AUTH_SECRET: certification-only-secret-that-is-at-least-32-characters
      APP_ENV: production
      ALLOWED_HOSTS: localhost,127.0.0.1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos -d pos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact certification commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CERTIFICATION_SHA }}
          fetch-depth: 1
      - name: Verify exact certification SHA
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$CERTIFICATION_SHA"
          echo "Certified SHA: $ACTUAL_SHA"
          echo "Expected SHA:  $CERTIFICATION_SHA"
          echo "Event:         $GITHUB_EVENT_NAME"
      - name: Write provenance evidence
        run: |
          {
            echo "certified_sha=$CERTIFICATION_SHA"
            echo "checked_out_sha=$(git rev-parse HEAD)"
            echo "workflow_sha=$GITHUB_WORKFLOW_SHA"
            echo "event=$GITHUB_EVENT_NAME"
            echo "run_id=$GITHUB_RUN_ID"
            echo "repository=$GITHUB_REPOSITORY"
          } | tee certification-provenance.txt
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[test]"
      - name: Architecture contracts
        run: python tests/architecture/test_contracts.py
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Clean database migration before tests
        run: alembic upgrade head
      - name: Full Python test suite
        env:
          APP_ENV: development
        run: pytest -q
      - name: Redis runtime certification
        run: python -c "import os; from src.infrastructure.redis.client import check_redis, create_redis_client; assert check_redis(create_redis_client(os.environ['REDIS_URL']))"
      - name: Dependency vulnerability audit
        run: python -m pip install pip-audit && pip-audit
      - name: Verify database connectivity
        run: python -c "from sqlalchemy import create_engine, text; import os; e=create_engine(os.environ['DATABASE_URL']); c=e.connect(); assert c.execute(text('select 1')).scalar()==1"
      - name: Migration downgrade and upgrade certification
        run: alembic downgrade base && alembic upgrade head && alembic upgrade head
      - name: PostgreSQL backup and restore certification
        run: |
          pg_dump "$LIBPQ_DATABASE_URL" --format=custom --file=/tmp/pos-certification.dump
          psql postgresql://pos:pos@localhost:5432/postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE pos_restore_test"
          pg_restore --no-owner --dbname=postgresql://pos:pos@localhost:5432/pos_restore_test /tmp/pos-certification.dump
          psql postgresql://pos:pos@localhost:5432/pos_restore_test -v ON_ERROR_STOP=1 -c "SELECT 1 FROM alembic_version LIMIT 1"
      - name: Validate production Compose configuration
        env:
          POSTGRES_PASSWORD: certification-db-password
          AUTH_SECRET: certification-only-secret-that-is-at-least-32-characters
        run: docker compose -f compose.production.yml config --quiet
      - name: Build production container
        run: docker build --tag pos-production-certification:${CERTIFICATION_SHA} .
      - name: Start disposable production stack
        env:
          POSTGRES_PASSWORD: certification-db-password
          AUTH_SECRET: certification-only-secret-that-is-at-least-32-characters
        run: docker compose -f compose.production.yml up -d --build
      - name: Production smoke test
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          docker compose -f compose.production.yml ps
          docker compose -f compose.production.yml logs --no-color app
          exit 1
      - name: Production readiness smoke test
        run: curl --fail --silent http://127.0.0.1:8000/ready
      - name: Production rollback/migration safety check
        env:
          POSTGRES_PASSWORD: certification-db-password
          AUTH_SECRET: certification-only-secret-that-is-at-least-32-characters
        run: |
          docker compose -f compose.production.yml exec -T app alembic downgrade -1
          docker compose -f compose.production.yml exec -T app alembic upgrade head
          docker compose -f compose.production.yml exec -T app alembic upgrade head
      - name: Stop disposable production stack
        if: always()
        env:
          POSTGRES_PASSWORD: certification-db-password
          AUTH_SECRET: certification-only-secret-that-is-at-least-32-characters
        run: docker compose -f compose.production.yml down -v
      - name: Upload certification provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certification-provenance-${{ env.CERTIFICATION_SHA }}
          path: certification-provenance.txt

  frontend:
    name: Frontend quality and behavioral certification
    runs-on: ubuntu-latest
    env:
      CERTIFICATION_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact certification commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CERTIFICATION_SHA }}
          fetch-depth: 1
      - name: Verify exact certification SHA
        working-directory: .
        run: test "$(git rev-parse HEAD)" = "$CERTIFICATION_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        run: npm install --ignore-scripts
      - name: TypeScript quality gate
        run: npm run typecheck
      - name: Frontend behavioral tests
        run: npm test
      - name: Production build
        run: npm run build

  hardware:
    name: Hardware agent certification
    runs-on: ubuntu-latest
    env:
      CERTIFICATION_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact certification commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CERTIFICATION_SHA }}
          fetch-depth: 1
      - name: Verify exact certification SHA
        run: test "$(git rev-parse HEAD)" = "$CERTIFICATION_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
      - name: Install hardware agent dependencies
        working-directory: hardware-agent
        run: npm install --ignore-scripts
      - name: Test hardware agent
        working-directory: hardware-agent
        run: npm test
