name: OCI Pilot Infrastructure Quality

on:
  pull_request:
    paths:
      - "infra/oci-pilot/**"
      - ".github/workflows/oci-pilot-infra-quality.yml"
  push:
    branches:
      - main
      - infra/prodx-pilot-terraform
    paths:
      - "infra/oci-pilot/**"
      - ".github/workflows/oci-pilot-infra-quality.yml"

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/oci-pilot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -check -diff

      - name: Terraform Init
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate -no-color
