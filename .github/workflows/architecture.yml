name: Architecture Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    name: Architecture contracts and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos -d pos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://pos:pos@localhost:5432/pos_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project test dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[test]"

      - name: Run executable architecture contracts
        run: python tests/architecture/test_contracts.py

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run unit and integration tests
        run: python -m pytest -q

      - name: Verify Redis runtime boundary
        run: python -c "import os; from src.infrastructure.redis.client import check_redis, create_redis_client; assert check_redis(create_redis_client(os.environ['REDIS_URL']))"

      - name: Upgrade database to head
        run: alembic upgrade head

      - name: Verify database connectivity
        run: python -c "from sqlalchemy import create_engine, text; import os; e=create_engine(os.environ['DATABASE_URL']); c=e.connect(); assert c.execute(text('select 1')).scalar()==1"

      - name: Verify downgrade and upgrade cycle
        run: alembic downgrade base && alembic upgrade head

      - name: Verify upgrade idempotency
        run: alembic upgrade head
