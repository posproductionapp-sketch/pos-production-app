name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos -d pos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://pos:pos@localhost:5432/pos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[test]"
      - name: Compile
        run: python -m compileall src tests
      - name: Architecture and unit tests
        run: pytest
      - name: Database migration
        run: alembic upgrade head
      - name: Database smoke check
        run: python -c "from sqlalchemy import create_engine, text; import os; e=create_engine(os.environ['DATABASE_URL']); c=e.connect(); assert c.execute(text('select 1')).scalar()==1"
