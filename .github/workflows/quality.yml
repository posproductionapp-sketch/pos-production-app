name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos -d pos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://pos:pos@localhost:5432/pos_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[test]"
      - name: Compile Python
        run: python -m compileall src tests
      - name: Database migration before database-backed tests
        run: alembic upgrade head
      - name: Architecture and unit tests
        run: pytest
      - name: Redis integration smoke check
        run: python -c "import os; from src.infrastructure.redis.client import check_redis, create_redis_client; assert check_redis(create_redis_client(os.environ['REDIS_URL']))"
      - name: Dependency vulnerability audit
        run: python -m pip install pip-audit && pip-audit
      - name: Database smoke check
        run: python -c "from sqlalchemy import create_engine, text; import os; e=create_engine(os.environ['DATABASE_URL']); c=e.connect(); assert c.execute(text('select 1')).scalar()==1"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Frontend test gate
        run: npm test

  hardware-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hardware-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"
      - name: Install hardware agent dependencies
        run: npm install --ignore-scripts
      - name: Test hardware agent
        run: npm test
