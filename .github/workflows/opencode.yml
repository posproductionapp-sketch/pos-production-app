name: opencode-primary

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: Task for OpenCode
        required: true
        type: string
  schedule:
    - cron: '17 2 * * *'

jobs:
  opencode:
    # Autonomous execution is restricted to trusted owner/collaborator activity and
    # same-repository branches so OPENAI_API_KEY is never exposed to forked code.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'issues' &&
       (github.event.issue.author_association == 'OWNER' ||
        github.event.issue.author_association == 'MEMBER' ||
        github.event.issue.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'issue_comment' &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'pull_request_review_comment' &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.pull_request.author_association == 'OWNER' ||
        github.event.pull_request.author_association == 'MEMBER' ||
        github.event.pull_request.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout trusted repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve autonomous task
        id: prompt
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PROMPT: ${{ inputs.prompt || '' }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
          ISSUE_TITLE: ${{ github.event.issue.title || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch)
              prompt="$DISPATCH_PROMPT"
              ;;
            schedule)
              prompt="Perform a full autonomous repository health audit. Inspect architecture, security, dependencies, TODO/FIXME risk, CI/CD, tests, production readiness, and documentation. Fix safe in-scope issues, run relevant validation, and create or update an AI branch/PR when changes are needed. Do not weaken gates."
              ;;
            issues)
              prompt="Autonomously triage and resolve GitHub issue #$ISSUE_NUMBER: $ISSUE_TITLE. Inspect the repository, implement the complete fix when it is in scope, run relevant tests, and create/update an AI branch and PR. If no code change is required, document the diagnosis and next action."
              ;;
            pull_request)
              prompt="Autonomously review PR #$PR_NUMBER: $PR_TITLE. Inspect the complete diff and affected code, run relevant tests and quality gates, fix defects directly on the PR branch when safe, and continue until the PR is production-ready. Never weaken tests, security, architecture, financial-integrity, inventory-integrity, multi-tenant, idempotency, auditability, offline-resilience, or server-authority gates."
              ;;
            issue_comment|pull_request_review_comment)
              prompt="$COMMENT_BODY"
              ;;
            *)
              prompt="Perform an autonomous repository review and fix any safe, in-scope production issues."
              ;;
          esac
          printf 'prompt<<EOF\n%s\nEOF\n' "$prompt" >> "$GITHUB_OUTPUT"

      - name: Run OpenCode autonomous agent
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          model: openai/gpt-5.6
          use_github_token: true
          prompt: |
            You are the autonomous PRIMARY engineering agent for PRODX POS.

            OWNER AUTHORIZATION: The repository owner has authorized autonomous execution
            for normal in-scope engineering work. Do not wait for the owner to click buttons,
            add comments, approve routine changes, or manually restart ordinary CI.

            AUTONOMOUS LOOP:
            1. Inspect the repository and relevant issue/PR/CI context.
            2. Diagnose the root cause rather than treating symptoms.
            3. Implement safe in-scope fixes.
            4. Run relevant tests, type checks, builds, security checks, and production gates.
            5. If validation fails, diagnose and fix it and rerun validation.
            6. Create/update an AI branch and PR when changes are required.
            7. Keep iterating until the task is complete or a genuine external blocker exists.
            8. Report blockers only when they require an external credential, unavailable
               service, protected GitHub setting, destructive production action, or scope
               expansion that cannot be safely inferred.

            NON-NEGOTIABLE GUARDRAILS:
            - Never weaken, delete, skip, or bypass tests or required quality/security gates.
            - Never expose secrets, tokens, API keys, or environment variables in comments,
              logs, commits, PR descriptions, artifacts, or source files.
            - Never execute untrusted fork code with repository secrets.
            - Never change production data destructively without an explicit task requiring it.
            - Preserve Production, Security, Architecture, Testing, Financial Integrity,
              Inventory Integrity, Multi-Tenant Isolation, Idempotency, Auditability,
              Offline Resilience, Server Authority, and Merge requirements.
            - Use AI branch names prefixed with `ai/` for newly created implementation branches.
            - Prefer small, reviewable commits and keep PR descriptions factual.

            CODE REVIEW STANDARD:
            Treat the repository as production software. Look for correctness bugs, security
            issues, race conditions, transaction/idempotency failures, authorization gaps,
            tenant isolation problems, migration hazards, flaky tests, dependency risks,
            CI failures, observability gaps, and regressions—not just formatting issues.

            Requested task:
            ${{ steps.prompt.outputs.prompt }}
